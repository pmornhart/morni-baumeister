name: MorniBaumeister
version: '${project.version}'
main: de.moinmorni.baumeister.BaumeisterPlugin
api-version: '1.21'
description: Baumeister für das MoinMorni-Netzwerk – ein Thema, eine Parzelle, die Zeit läuft. 2 bis 16 Leute.
authors: [MoinMorni]
website: https://moinmorni.net
# Läuft mit dem Netzwerk-Plugin (Sprache, Party, Statistik) und auch allein.
softdepend: [MoinMorni]

commands:
  baumeisteradmin:
    description: Verwaltung (info, status, start, thema, vorspulen, stopp, neubauen, neuladen)
    usage: /baumeisteradmin <info|status|start [spielart] [thema]|thema <kennung>|vorspulen <weiter|sekunden>|stopp|neubauen|neuladen>
    aliases: [bmadmin]
    permission: moinmorni.baumeister.admin
  spielart:
    description: Über die Spielart abstimmen
    usage: /spielart [klassisch|schnell|paare]
    aliases: [art, mode]
  bereit:
    description: In der Bauhütte bereit melden
    usage: /bereit
    aliases: [ready]
  thema:
    description: Themen-Wahl öffnen oder abstimmen (1–3)
    usage: /thema [1|2|3]
    aliases: [theme]
  werkzeug:
    description: Bau-Hilfen öffnen (Boden, Zeit, Wetter, Köpfe, Banner, Füllen, Ersetzen)
    usage: /werkzeug
    aliases: [tools, hilfen]
  bewerten:
    description: Den gezeigten Bau bewerten (1 = Naja … 5 = Meisterwerk)
    usage: /bewerten <1-5>
    aliases: [rate]
  zuschauen:
    description: Einer Runde zuschauen
    usage: /zuschauen [spieler]
    aliases: [spectate, spec]
  verlassen:
    description: Runde oder Zuschauen verlassen (zurück in die Bauhütte)
    usage: /verlassen
    aliases: [leave]
  stats:
    description: Statistik ansehen
    usage: /stats [spieler]
    aliases: [statistik]
  top:
    description: Die besten Baumeister
    usage: /top
    aliases: [bestenliste, leaderboard]

permissions:
  moinmorni.baumeister.admin:
    description: Baumeister verwalten und im Kreativmodus in der Baumeister-Welt bauen
    default: op
